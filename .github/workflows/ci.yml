name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  testes-unitarios:
    name: Testes Unitários (sem Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências de desenvolvimento
        run: pip install -r requirements-dev.txt

      - name: Executar testes unitários em memória
        run: pytest -v -m "not integracao and not integration"

  testes-integracao:
    name: Testes de Integração (com Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar todas as dependências
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Subir ambiente com Docker Compose
        run: docker compose up -d --build

      - name: Aguardar prontidão dos bancos e da API
        run: python scripts/esperar_bancos.py

      - name: Executar suíte de integração contra bancos reais
        run: pytest -v -m integracao

      - name: Encerrar containers e limpar volumes
        if: always()
        run: docker compose down -v
